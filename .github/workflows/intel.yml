name: Refresh supplier intel
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_intel.py data/intel.json
      - name: Commit if changed
        run: |
          git config user.name "bigredbox-intel"
          git config user.email "intel@users.noreply.github.com"
          git add data/intel.json
          git diff --cached --quiet || git commit -m "Refresh supplier intel $(date -u +%F)"
          git push
